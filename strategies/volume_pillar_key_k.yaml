# 倍量柱关键K选股策略
name: volume_pillar_key_k
display_name: 倍量柱关键K
description: |
  通达信选股公式 - 倍量柱 + 关键K策略
  核心逻辑：KDJ超卖 + 阳量优势 + 28日整理充分 + 最大量在阳线日 + 倍量柱>=3次 OR 关键K

