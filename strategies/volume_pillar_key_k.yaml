instructions: |
  **倍量柱关键K选股策略（Volume Pillar + Key K）**

  适用场景：寻找超卖区域企稳、主力吸筹信号明确的标的。

  ---

  ## 核心选股条件（5个全部满足 → 选出）

  ### ① KDJ超卖（J值 <= 13）
  - 计算参数：period=9，标准KDJ公式
  - J值必须处于超卖区域，表示短期跌幅足够深
  -判定：J <= 13

  ### ② 阳量/阴量比 > 1.5（21日 或 14日）
  - 真实阳线定义：C > O AND NOT(C < REF(C,1))
  - 真实阴线定义：C < O AND NOT(C > REF(C,1))
  - 阳量 = 真实阳线日的成交量之和
  - 阴量 = 真实阴线日的成交量之和
  - 判定：VY21 / VI21 > 1.5  OR  VY14 / VI14 > 1.5

  ### ③ GOOD28：28日无高位突破+放量下跌
  - 28日整理区间：取28日内的开盘价最低价 + 85%区间
  - 当前处于高位（价格 >= 85%分位）AND 放量下跌（量>1.15*前量 AND 收盘<前收）
  - 以上组合出现 → GOOD28=False（排除）
  - 判定：NOT(高位突破+放量下跌)

  ### ④ MAX28：28日最大量不在阴线日
  - 找出28日内成交量最大那天
  - 那天必须是真实阳线，不能是真实阴线
  - 判定：28日最大量日 = 真实阳线

  ### ⑤ 触发信号（二选一）
  **A. 倍量阳柱 >= 3次（28日内）**
    - 单次倍量阳柱条件（同时满足）：
      - volume > 1.8 * REF(volume, 1)   # 量能翻倍
      - close > open                     # 收阳线
      - volume > AVG(volume, 40)        # 量能高于40日均量
    - 28日内满足条件的次数 >= 3

  **B. 关键K（替代触发）**
    - 同时满足：
      - close > REF(close, 1)            # 阳线
      - close >= open                     # 收涨
      - volume > 1.75 * AVG(volume, 40) # 放量
      - close > R55                       # 站上40日55%分位

  ---

  ## 参考指标（不参与选股，仅展示辅助）

  - **白线（知行短期趋势线）**：DEMA(EMA(CLOSE,10),10)
  - **黄线（知行大哥线）**：(MA14+MA28+MA57+MA114)/4
  - **MA60**：60日均线
  - **EMA13**：13日指数均线
  - **R55**：40日收盘价的55%分位

  ## 趋势状态判断（参考）

  | 条件 | 状态 |
  |------|------|
  | 价格 < 白线 < 黄线 | 🔴跌破白线预警 |
  | 价格 < 黄线 < 白线 | 🔴跌破黄线止损 |
  | 白线 < 价格 < 黄线 | 🟡白线撑/黄线压 |
  | 黄线 < 价格 < 白线 | 🟡黄线撑/白线压 |
  | 价格 > 白线 > 黄线 | 🟢多头排列持有 |
  | 价格 > 黄线 > 白线 | 🟢突破黄线站稳 |

  ---

  ## 分析步骤

  1. 获取标的K线数据（前复权，80日）
  2. 预计算所有指标（J值/阳阴量比/GOOD28/MAX28/倍量次数/关键K）
  3. 按顺序检查5个条件，全通过才输出买入信号
  4. 如实输出各指标数值，不得编造

  ## 输出要求

  必须包含：
  - 各条件通过/未通过状态及具体数值
  - 倍量阳柱日期列表
  - 趋势状态（白线/黄线位置）
  - 明确的"选入/不选入"结论及理由
